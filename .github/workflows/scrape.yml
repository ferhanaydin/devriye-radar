name: EGM Radar Scraper

on:
  schedule:
    - cron: '*/30 * * * *'  # Her 30 dakikada bir
  workflow_dispatch:          # Manuel tetikleme

# GitHub'ın repoya yazabilmesi için gerekli izin
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Job seviyesinde hata olsa bile mail gönderme
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bağımlılıkları Yükle
        run: npm install axios
        continue-on-error: true   # npm hatası workflow'u durdurmasın

      - name: Kazımayı Çalıştır
        run: node scraper-gh.js
        continue-on-error: true   # Scraper hata verse bile devam et

      - name: Değişiklikleri Kaydet ve Gönder
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # Değişiklik yoksa commit atma (|| true ile hatayı yoksay)
          git diff --quiet eds_markers.json || git add eds_markers.json && \
          git commit -m "🚀 Otomatik: EGM radar verisi güncellendi" || true
          git push || true
        continue-on-error: true   # Push hatası mail göndermesin
